name: Build Supernote Plugin (.snplg)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-snplg:
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '19'

      - name: Install Android SDK Platform 35 & Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch Supernote Android Wrapper & buildPlugin.sh from 82deg/supernote-plugins
        run: |
          git clone --depth 1 https://github.com/82deg/supernote-plugins.git ref_plugins
          TEMPLATE_DIR=$(find ref_plugins -name "buildPlugin.sh" -exec dirname {} \; | head -n 1)
          echo "Using template directory: $TEMPLATE_DIR"
          if [ -z "$TEMPLATE_DIR" ]; then
            echo "Could not find buildPlugin.sh in ref_plugins:"
            find ref_plugins -maxdepth 3
            exit 1
          fi
          cp -r "$TEMPLATE_DIR/android" ./android
          cp "$TEMPLATE_DIR/buildPlugin.sh" ./buildPlugin.sh
          chmod +x ./buildPlugin.sh
          if [ -f "$TEMPLATE_DIR/metro.config.js" ]; then cp "$TEMPLATE_DIR/metro.config.js" ./metro.config.js; fi
          if [ -f "$TEMPLATE_DIR/babel.config.js" ]; then cp "$TEMPLATE_DIR/babel.config.js" ./babel.config.js; fi
          TEMPLATE_DIR="$TEMPLATE_DIR" node -e '
            const fs = require("fs");
            const tplPkg = JSON.parse(fs.readFileSync(process.env.TEMPLATE_DIR + "/package.json", "utf8"));
            const myPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (tplPkg.dependencies && tplPkg.dependencies["sn-plugin-lib"]) {
              myPkg.dependencies["sn-plugin-lib"] = tplPkg.dependencies["sn-plugin-lib"];
            }
            fs.writeFileSync("package.json", JSON.stringify(myPkg, null, 2));
          '
          rm -rf ref_plugins

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build .snplg Package (Pass 1 - Autolink)
        run: ./buildPlugin.sh || true

      - name: Build .snplg Package (Pass 2 - Package)
        run: ./buildPlugin.sh

      - name: Upload .snplg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSendLayer4Placer-snplg
          path: "**/*.snplg"
